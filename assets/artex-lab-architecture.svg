<text x="1230" y="270" font-size="17" fill="#526579" font-weight="400">ARTEX_BIND_ADDR / WAF_BIND_ADDR</text>
<text x="1230" y="294" font-size="17" fill="#526579" font-weight="400">can restrict their listen address.</text>
