<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
<title id="title">ARTEX local lab architecture</title><desc id="desc">Windows host with local LM Studio and Docker Desktop. ARTEX reaches the WAF through ingress_net, PostgreSQL through db_net, and the local model through the host gateway. The WAF routes every target API request over proxy_net. All four target services send telemetry to the defender through control_net; the defender revokes runs at identity, workflow and records.</desc>
<defs>
<marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147d92"/></marker>
<marker id="model" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8b5ab5"/></marker>
<marker id="telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d19a24"/></marker>
<marker id="revoke" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c45064"/></marker>
<marker id="state" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
</defs><g font-family="Segoe UI, Arial, sans-serif">
