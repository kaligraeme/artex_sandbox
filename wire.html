<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARTEX | Wire Diagram Simulation v2.4.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
  :root {
    --bg: #071426;
    --turquoise: #00f0ff;
    --turquoise-glow: rgba(0, 240, 255, 0.45);
    --green: #00ff77;
    --green-glow: rgba(0, 255, 119, 0.65);
    --green-wire: rgba(0, 255, 119, 0.48);
    --red: #ff2244;
    --red-glow: rgba(255, 34, 68, 0.85);
    --red-wire: #ff2244;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg);
    color: #fff;
    font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', Consolas, monospace;
  }

  /* Full screen canvas and graph viewport */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 45%, #10253b 0%, #071426 75%, #050f1e 100%);
    overflow: hidden;
  }

  /* Faint background grid for circuit cyber aesthetic */
  .circuit-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0, 255, 119, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 119, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  /* TOP HEADER - Mode selection strip + NEW RUN + Live HUD */
  .top-bar {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 0 150px;
    z-index: 1000;
    pointer-events: none;
  }

  /* 4 Run Type Scenario Buttons along the top */
  .mode-strip {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  .mode-btn {
    background: rgba(9, 16, 24, 0.88);
    border: 1px solid rgba(88, 217, 219, 0.22);
    color: #8fa3b8;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    backdrop-filter: blur(8px);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    text-align: left;
  }

  .mode-btn:hover {
    border-color: var(--turquoise);
    color: #e6edf5;
    background: rgba(14, 28, 38, 0.95);
    transform: translateY(-1px);
  }

  .mode-btn.selected {
    background: rgba(0, 36, 44, 0.95);
    border-color: var(--turquoise);
    color: var(--turquoise);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.15);
  }

  .mode-btn .mode-title {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #abbecd;
  }

  .mode-btn.selected .mode-title {
    color: var(--turquoise);
  }

  .mode-btn .mode-desc {
    font-size: 7.5px;
    letter-spacing: 0.05em;
    color: #64788c;
    white-space: nowrap;
  }

  .mode-btn.selected .mode-desc {
    color: #8bebf0;
  }

  .run-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  #new-run-btn {
    pointer-events: auto;
    background: rgba(0, 30, 36, 0.85);
    border: 1.5px solid var(--turquoise);
    color: var(--turquoise);
    padding: 5px 14px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 16px var(--turquoise-glow), inset 0 0 10px rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #new-run-btn:hover {
    background: var(--turquoise);
    color: #001015;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.85), inset 0 0 15px rgba(255, 255, 255, 0.7);
    transform: scale(1.04);
  }

  #new-run-btn:active {
    transform: scale(0.98);
  }

  #new-run-btn .run-icon {
    font-size: 12px;
    display: inline-block;
    transition: transform 0.4s ease;
  }

  #new-run-btn:hover .run-icon {
    transform: rotate(180deg);
  }

  /* Live Outcome HUD under NEW RUN button */
  #run-hud {
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--turquoise);
    background: rgba(0, 16, 22, 0.8);
    border: 1px solid rgba(0, 240, 255, 0.25);
    padding: 4px 9px;
    border-radius: 3px;
    backdrop-filter: blur(6px);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    transition: all 0.3s ease;
  }
  #run-hud.breached {
    color: #ff9ba8;
    border-color: rgba(255, 34, 68, 0.4);
    text-shadow: 0 0 4px rgba(255, 34, 68, 0.3);
    background: rgba(26, 4, 8, 0.85);
  }
  #run-hud.contained {
    color: #65d7a5;
    border-color: rgba(101, 215, 165, 0.4);
    text-shadow: 0 0 8px rgba(101, 215, 165, 0.6);
    background: rgba(4, 20, 14, 0.85);
  }

  /* Discreet nav link to return to table view */
  .back-link {
    position: absolute;
    top: 20px;
    right: 26px;
    pointer-events: auto;
    color: rgba(255, 255, 255, 0.35);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 5px 11px;
    border-radius: 3px;
    transition: all 0.2s;
    z-index: 1000;
  }
  .back-link:hover {
    color: var(--turquoise);
    border-color: var(--turquoise);
    background: rgba(0, 240, 255, 0.08);
  }

  /* SVG layer for wires and pulses */
  #wire-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .wire {
    fill: none;
    stroke: var(--green-wire);
    stroke-width: 1.25;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.8s ease, stroke 0.4s ease, stroke-width 0.3s ease, filter 0.3s ease, stroke-opacity 0.4s ease;
  }

  .wire.revealed, .wire.active-wire, .wire.hit-wire, .wire.defended-wire { opacity: 1; }

  .attack-entry {
    fill: none;
    stroke: #ff304f;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 3 7;
    animation: probeFade 0.75s ease-out forwards;
    filter: drop-shadow(0 0 5px rgba(255, 34, 68, 0.75));
  }

  @keyframes probeFade { 0%, 45% { opacity: 1; } 100% { opacity: 0; } }

  .attack-entry-head {
    fill: #ff304f;
    filter: drop-shadow(0 0 5px rgba(255, 34, 68, 0.75));
  }

  .wire.active-wire {
    stroke: #ff304f;
    stroke-opacity: 0.95;
    stroke-width: 2;
    stroke-dasharray: 3 7;
    filter: drop-shadow(0 0 4px rgba(255, 34, 68, 0.75));
  }

  .wire.hit-wire {
    stroke: var(--red);
    stroke-opacity: 0.95;
    stroke-width: 2.2;
    filter: drop-shadow(0 0 6px var(--red-glow));
    stroke-dasharray: none;
  }

  /* Traveling energy packet along wires */
  .wire-packet {
    fill: var(--red);
    filter: drop-shadow(0 0 6px var(--red));
  }

  /* DOM Nodes Layer */
  #nodes-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
  }

  /* Smaller, sleek node items */
  .node {
    position: absolute;
    /* Anchor the 36px icon, not the combined icon-and-label box, at x/y. */
    transform: translate(-50%, -18px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .node:hover {
    transform: translate(-50%, -18px) scale(1.15);
    transform-origin: center 18px;
    z-index: 100;
  }

  /* Node Icon Box - Smaller */
  .node-icon-wrapper {
    position: relative;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Ambient glowing ring around icon */
  .node-halo {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px dashed var(--green);
    opacity: 0.35;
    transition: all 0.4s ease;
    animation: rotateSlow 25s linear infinite;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* The Icon itself using pure CSS Mask: smaller, crisp, transparent */
  .node-icon {
    width: 26px;
    height: 26px;
    background-color: var(--green);
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    filter: drop-shadow(0 0 5px var(--green-glow));
    transition: background-color 0.4s ease, filter 0.4s ease, transform 0.3s ease;
  }

  /* Node Label - Very Light Green for maximum legibility */
  .node-label {
    margin-top: 4px;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #d4ffe8;
    text-shadow: none;
    background: #071426;
    border-radius: 2px;
    padding: 1px 3px;
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: center;
    width: max-content;
    max-width: 150px;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  /* KEV Title underneath in RED (hidden initially, displays on hit) */
  .node-kev {
    margin-top: 3px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #ff9ba8;
    text-shadow: 0 0 3px rgba(255, 34, 68, 0.25);
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: center;
    width: max-content;
    max-width: 160px;
    background: #2d060c;
    border: 1px solid rgba(255, 34, 68, 0.55);
    border-radius: 3px;
    padding: 2px 5px;
    opacity: 0;
    transform: translateY(-3px) scale(0.9);
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 34, 68, 0.3);
  }

  .node-kev .cve {
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  .node-kev .vuln-title {
    display: block;
    font-size: 8px;
    opacity: 1;
    font-weight: 600;
  }

  /* A deployed decoy remains visibly distinct before and after a trigger. */
  .node.canary .node-icon { background-color: #ffd83d; filter: drop-shadow(0 0 9px #ffd83d); }
  .node.canary .node-halo { border-color: #ffd83d; opacity: 0.85; box-shadow: 0 0 10px rgba(255,216,61,.5); }
  .node.canary .node-label { color: #ffe45c; }

  /* HIT STATE: Lit in RED */
  .node.hit .node-icon {
    background-color: var(--red);
    filter: drop-shadow(0 0 12px var(--red-glow)) drop-shadow(0 0 20px var(--red));
    transform: scale(1.1);
  }

  .node.hit .node-halo {
    border-color: var(--red);
    border-style: solid;
    opacity: 0.85;
    box-shadow: 0 0 12px var(--red-glow);
    animation: hitPulse 1.2s ease-out infinite alternate;
  }

  .node.hit .node-label {
    color: #ffadb8;
    text-shadow: 0 0 4px rgba(255, 34, 68, 0.3);
  }

  .node.hit, .node.defended {
    z-index: 10;
  }

  .node.hit .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* DEFENDED / BLOCKED STATE */
  .node.defended .node-icon {
    background-color: #f3bd64;
    filter: drop-shadow(0 0 10px rgba(243, 189, 100, 0.8));
    transform: scale(1.05);
  }
  .node.defended .node-halo {
    border-color: #f3bd64;
    border-style: double;
    opacity: 0.85;
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.5);
  }
  .node.defended .node-label {
    color: #f3bd64;
    text-shadow: 0 0 6px rgba(243, 189, 100, 0.6);
  }
  .node.defended .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
    color: #f3bd64;
    border-color: rgba(243, 189, 100, 0.6);
    background: #1e1606;
    text-shadow: 0 0 8px rgba(243, 189, 100, 0.5);
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.3);
  }

  /* DATABASE CLUSTER BREACH TARGET */
  .node.breach-target .node-icon {
    background-color: #ff003c;
    filter: drop-shadow(0 0 16px #ff003c) drop-shadow(0 0 28px #ff003c);
    animation: breachShake 0.4s ease infinite alternate;
  }
  .node.breach-target .node-kev {
    border-color: #ff003c;
    background: #32000c;
    box-shadow: 0 0 16px rgba(255, 0, 60, 0.7);
  }

  @keyframes breachShake {
    0% { transform: scale(1.12) rotate(-2deg); }
    100% { transform: scale(1.15) rotate(2deg); }
  }

  .wire.defended-wire {
    stroke: #765d34 !important;
    stroke-opacity: 0.7 !important;
    stroke-dasharray: 4 4 !important;
  }

  @keyframes hitPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.22); opacity: 0.3; }
  }

  /* Flash impact burst when hit */
  .impact-burst {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--red);
    pointer-events: none;
    animation: burstExpand 0.65s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
  }

  @keyframes burstExpand {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(5.5); opacity: 0; }
  }
  /* Small incident-ticket drum in the bottom-right corner. */
  .soc-ticker { position: fixed; z-index: 30; right: 8px; bottom: 8px; width: clamp(170px, 14vw, 225px); height: 108px; overflow: hidden; pointer-events: none; font: 10px Arial, sans-serif; }
  .soc-cards { display: flex; flex-direction: column; gap: 0; }
  .soc-cards { transition: transform 2.8s ease-in-out; }
  .soc-cards.looping { transition: none; animation: socLoop var(--soc-loop-duration) linear infinite; }
  @keyframes socLoop { from { transform: translateY(0); } to { transform: translateY(-50%); } }
  .soc-card { flex: 0 0 36px; height: 36px; box-sizing: border-box; overflow: hidden; background: #fff; border: 1px solid #2871b9; border-left: 3px solid #2871b9; color: #132d48; padding: 2px 5px; }
  .soc-card-head { display: flex; justify-content: space-between; gap: 4px; font-weight: bold; border-bottom: 1px solid #9cbfe0; padding-bottom: 2px; }
  .soc-title, .soc-detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .soc-detail { margin-top: 2px; color: #284967; font-size: 9px; }
  .soc-severity { flex: none; font-size: 9px; color: #a12e24; }
  .soc-empty { color: #58728c; }
  #preset-btn {
    background: rgba(16, 26, 40, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #93c5fd;
    font: 600 11px/1 'JetBrains Mono', monospace;
    letter-spacing: 0.06em;
    padding: 7px 11px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  #preset-btn:hover { border-color: #38bdf8; color: #e0f2fe; }
  #preset-btn.demo { border-color: rgba(245, 158, 11, 0.55); color: #fcd34d; }
  @media (prefers-reduced-motion: reduce) { .soc-cards { transition: none; } .soc-cards.looping { animation: none; } }
</style>
</head>
<body>

<div id="viewport">
  <div class="circuit-grid"></div>

  <!-- Top Bar: 4 Run Scenario Mode Buttons with Details + NEW RUN + Live HUD -->
  <div class="top-bar">
    <div class="mode-strip" role="group" aria-label="Defense scenario run types">
      <button class="mode-btn selected" data-mode="baseline" title="Baseline scenario without mitigation">
        <span class="mode-title">01 / BASELINE</span>
        <span class="mode-desc">Unmitigated · 0% Defended · Full Chain Breach</span>
      </button>
      <button class="mode-btn" data-mode="patch" title="Perimeter virtual patching via Edge WAF">
        <span class="mode-title">02 / VIRTUAL PATCH</span>
        <span class="mode-desc">Edge WAF · HTTP virtual patches [SI-2]</span>
      </button>
      <button class="mode-btn" data-mode="defender" title="Agentic SOAR zero-trust token containment">
        <span class="mode-title">03 / AGENTIC SOAR</span>
        <span class="mode-desc">Agentic response · Mesh isolation [SI-4]</span>
      </button>
      <button class="mode-btn" data-mode="combined" title="Multi-layered defense-in-depth posture">
        <span class="mode-title">04 / DEFENSE-IN-DEPTH</span>
        <span class="mode-desc">WAF + Agentic SOAR + Canary trigger</span>
      </button>
    </div>

    <div class="run-row">
      <button id="new-run-btn" title="Generate a new randomized infrastructure topology">
        <span class="run-icon">↻</span>
        <span>NEW INFRA</span>
      </button>
      <button id="preset-btn" title="Cycle between Mixed Estate (may have 0 complete paths), Demo-Ready (intentional CVE 4-layer path), and Credential-in-Logs">
        <span>PRESET: MIXED</span>
      </button>
      <div id="run-hud">READY · SELECT SCENARIO & RUN SIMULATION</div>
    </div>
  </div>

  <a href="index.html" class="back-link" title="Switch back to tabular view">TABLE VIEW ↗ <span style="opacity:0.6;font-size:9px;margin-left:5px;border-left:1px solid rgba(255,255,255,0.2);padding-left:7px;">v2.4.0</span></a>

  <div class="soc-ticker" aria-label="Simulated SOC tickets">
    <div id="soc-cards" class="soc-cards" aria-live="off"></div>
  </div>

  <!-- Fullscreen SVG for wires & pulses -->
  <svg id="wire-svg"></svg>

  <!-- HTML nodes layer for GPU accelerated icon masking and text -->
  <div id="nodes-layer"></div>
</div>

<script src="js/wire-engine.js"></script>
<script>
const {
  LAYER_CONFIG,
  DEFENSE_SCENARIOS,
  cveTooltip,
  generateEstate,
  simulateEstate,
  migrateSnapshot
} = window.WireEngine;

const ICON_BASE = 'assets/diagram-icons/transparent/';
const INFRA_STORAGE_KEY = 'artex-wire-infrastructure-v6';
const PRESET_STORAGE_KEY = 'artex-wire-preset';

// Tickets are illustrative scenario events; severity is estimated, not a CVSS score.
const socTickets = new Map();
let socLooping = false;
function renderSocTickets() {
  const cards = document.getElementById('soc-cards');
  const tickets = [...socTickets.values()];
  cards.replaceChildren();
  const loop = socLooping && tickets.length > 3;
  cards.classList.toggle('looping', loop);
  cards.style.setProperty('--soc-loop-duration', `${Math.max(24, tickets.length * 5)}s`);
  cards.style.transform = loop ? '' : `translateY(-${Math.max(0, tickets.length - 3) * 36}px)`;
  const displayed = loop ? [...tickets, ...tickets] : tickets;
  displayed.forEach((ticket, index) => {
    const card = document.createElement('div');
    card.className = 'soc-card';
    if (index >= tickets.length) card.setAttribute('aria-hidden', 'true');
    const head = document.createElement('div'); head.className = 'soc-card-head';
    const title = document.createElement('span'); title.className = 'soc-title'; title.textContent = ticket.title;
    const severity = document.createElement('span'); severity.className = 'soc-severity'; severity.textContent = ticket.severity;
    const detail = document.createElement('div'); detail.className = 'soc-detail'; detail.textContent = ticket.detail;
    head.append(title, severity); card.append(head, detail); cards.appendChild(card);
  });
}

function recordSocTicket(node, ev) {
  if (ev.outcome === 'revisit' || ev.outcome === 'truncated') return;
  const mitigation = ev.mitigation || {};
  const succeeded = ev.outcome === 'succeeded';
  const finding = ev.finding;
  let detail;
  if (mitigation.badge?.includes('CANARY')) {
    detail = `Decoy access detected on ${node.label}`;
  } else if (ev.outcome === 'ineligible') {
    detail = ev.reason;
  } else if (finding?.kind === 'anonymous_access') {
    detail = succeeded ? `Anonymous access observed on ${node.label}` : `Anonymous access request to ${node.label}`;
  } else if (ev.credentialUsed) {
    detail = `Credential ${ev.credentialUsed.label} used on ${node.label}`;
  } else if (finding?.kind === 'password_spray') {
    detail = `Password spray activity on ${node.label}`;
  } else if (mitigation.badge?.includes('WAF')) {
    detail = `WAF rule match on ${node.label} · ${finding?.cveId || 'HTTP'}`;
  } else if (finding?.cveId) {
    detail = succeeded ? `Suspicious activity on ${node.label} · ${finding.cveId}` : `Suspected ${finding.title} · ${finding.cveId}`;
  } else {
    detail = ev.reason || `Access event on ${node.label}`;
  }

  const severity = ev.outcome === 'ineligible'
    ? 'LOW'
    : succeeded && node.layerIdx >= 2
      ? 'CRITICAL'
      : succeeded
        ? 'HIGH'
        : 'MEDIUM';

  socTickets.set(`${node.id}-${ev.outcome}`, { title: `[SIM] ${node.label}`, severity, detail });
  if (mitigation.badge?.includes('WAF VIRTUAL PATCH')) {
    socTickets.set(`${node.id}-waf-response`, { title: '[SIM] Virtual patch block', severity: 'MEDIUM', detail: `WAF blocked request to ${node.label}` });
  } else if (mitigation.badge?.includes('AGENTIC SOAR')) {
    socTickets.set(`${node.id}-soar-response`, { title: '[SIM] SOAR containment', severity: 'HIGH', detail: mitigation.reason });
  } else if (mitigation.badge?.includes('CANARY')) {
    socTickets.set(`${node.id}-canary-response`, { title: '[SIM] Canary alert', severity: 'HIGH', detail: `Decoy access detected at ${node.label}` });
    socTickets.set(`${node.id}-soar-response`, { title: '[SIM] SOAR containment', severity: 'HIGH', detail: `Playbook contained session at ${node.label}` });
  }
  renderSocTickets();
}

let currentEstate = null;
let currentNodes = [];
let currentWires = [];
let simulationGeneration = 0;
let activeTimeouts = [];
let isSimulating = false;
let runCount = 0;
let runStats = { hits: 0, blocks: 0, ineligible: 0, truncated: 0, lakesBreached: 0, publicExposures: 0, wafBlocks: 0, soarBlocks: 0, canaryBlocks: 0 };
let currentMode = 'baseline';
let currentPreset = 'mixed';

window.currentNodes = currentNodes;
window.currentWires = currentWires;
window.runStats = runStats;
window.isSimulating = false;
window.runCount = 0;

const svg = document.getElementById('wire-svg');
const nodesLayer = document.getElementById('nodes-layer');
const newRunBtn = document.getElementById('new-run-btn');
const presetBtn = document.getElementById('preset-btn');
const runHud = document.getElementById('run-hud');

function safeTimeout(fn, delay) {
  const t = setTimeout(fn, delay);
  activeTimeouts.push(t);
  return t;
}

function clearAllActiveTimeouts() {
  activeTimeouts.forEach(t => clearTimeout(t));
  activeTimeouts = [];
}

function getDefaultNodeBadge(asset, findings) {
  if (!findings.length) {
    return { code: 'NO FINDING', title: 'No finding modeled; security status is unknown' };
  }
  const f = findings[0];
  if (f.kind === 'cve') {
    return { code: `${f.cveId}${f.inKev ? ' · KEV' : ''}`, title: f.title };
  }
  if (f.kind === 'anonymous_access') {
    return { code: `${f.technique} · PUBLIC`, title: f.title };
  }
  if (f.kind === 'password_spray') {
    return { code: `${f.technique} · SPRAY`, title: f.mfaProtected ? 'MFA enforced' : 'No MFA/lockout' };
  }
  return { code: f.technique || 'FINDING', title: f.title };
}

function formatAssetTooltip(asset, findings, credentials) {
  const lines = [
    `${asset.label} (${asset.trustZone})`,
    `Interfaces: ${asset.interfaces.join(', ')}`
  ];
  if (!findings.length) {
    lines.push('No finding modeled; security status is unknown.');
  } else {
    findings.forEach(f => {
      lines.push(`Finding [${f.provenance}]: ${f.cveId ? f.cveId + ' · ' : ''}${f.title}`);
      if (f.sourceUrl) lines.push(`Source: ${f.sourceUrl} (reviewed ${f.sourceReviewed}); deployment and outcome are synthetic.`);
    });
  }
  if (credentials.length) {
    credentials.forEach(c => {
      lines.push(`Stored credential: ${c.label} (requires ${c.requiredSourceCapability})`);
    });
  }
  return lines.join('\n');
}

function layoutGraph(estate) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const graphTop = Math.min(h * 0.4, document.querySelector('.top-bar').getBoundingClientRect().bottom + 65);
  const graphBottom = Math.max(graphTop + 1, h - 65);
  const graphHeight = graphBottom - graphTop;

  currentNodes = [];
  currentWires = [];
  nodesLayer.innerHTML = '';
  svg.innerHTML = '';

  const overlappingControls = new Set(['waf-proxy', 'iam-idp', 'threat-det']);
  const controlCounts = new Map();

  currentNodes = estate.assets.map(asset => {
    let displayLabel = asset.label.replace(/ · (?:Decommissioned|P\.o\.C)$/, '');
    if (overlappingControls.has(asset.groupId)) {
      const position = (controlCounts.get(asset.groupId) || 0) + 1;
      controlCounts.set(asset.groupId, position);
      if (position === 2) displayLabel += ' · Decommissioned';
      if (position === 3) displayLabel += ' · P.o.C';
    }
    const findings = estate.findings.filter(f => f.assetId === asset.id);
    const creds = estate.credentials.filter(c => c.sourceAssetId === asset.id);
    return {
      ...asset,
      label: displayLabel,
      findings,
      creds,
      x: asset.x * w,
      y: graphTop + asset.y * graphHeight,
      downstream: [],
      hit: false,
      defended: false,
      el: null
    };
  });

  const nodesById = new Map(currentNodes.map(n => [n.id, n]));
  estate.relationships.forEach(rel => {
    const source = nodesById.get(rel.sourceId);
    const target = nodesById.get(rel.targetId);
    if (!source || !target) return;
    source.downstream.push(target.id);
    createWire(source, target, rel);
  });

  currentNodes.forEach(node => {
    const el = document.createElement('div');
    el.className = 'node';
    el.id = 'node-' + node.id;
    el.title = formatAssetTooltip(node, node.findings, node.creds);
    el.style.left = `${node.x}px`;
    el.style.top = `${node.y}px`;

    const badge = getDefaultNodeBadge(node, node.findings);
    el.innerHTML = `
      <div class="node-icon-wrapper">
        <div class="node-halo"></div>
        <div class="node-icon" style="-webkit-mask-image: url('${ICON_BASE}${node.icon}'); mask-image: url('${ICON_BASE}${node.icon}');"></div>
      </div>
      <div class="node-label">${node.label}</div>
      <div class="node-kev">
        <span class="cve">${badge.code}</span>
        <span class="vuln-title">${badge.title}</span>
      </div>
    `;
    el.addEventListener('click', () => revealNodeWires(node, 4000));
    nodesLayer.appendChild(el);
    node.el = el;
  });

  window.currentNodes = currentNodes;
  window.currentWires = currentWires;
  renderSocTickets();
}

function createWire(source, target, relationship) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'wire');
  svg.appendChild(path);
  const wire = { source, target, relationship, path, hit: false, defended: false };
  path.setAttribute('d', `M ${source.x} ${source.y} L ${target.x} ${target.y}`);
  currentWires.push(wire);
}

function revealNodeWires(node, duration = 1200) {
  currentWires.filter(wire => wire.source.id === node.id || wire.target.id === node.id).forEach(wire => {
    const revealId = (wire.revealId || 0) + 1;
    wire.revealId = revealId;
    wire.path.classList.add('revealed');
    safeTimeout(() => {
      if (wire.revealId === revealId) wire.path.classList.remove('revealed');
    }, duration);
  });
}

function resetInfraVisuals() {
  socLooping = false;
  socTickets.clear();
  renderSocTickets();
  simulationGeneration++;
  clearAllActiveTimeouts();

  svg.querySelectorAll('.attack-entry, .attack-entry-head, .wire-packet').forEach(el => el.remove());
  nodesLayer.querySelectorAll('.impact-burst').forEach(b => b.remove());

  currentNodes.forEach(node => {
    node.hit = false;
    node.defended = false;
    node.capabilities = [];
    if (node.el) {
      node.el.className = 'node';
      node.el.querySelector('.node-label').textContent = node.label;
      node.el.title = formatAssetTooltip(node, node.findings, node.creds);
      const badge = getDefaultNodeBadge(node, node.findings);
      const kevEl = node.el.querySelector('.node-kev');
      if (kevEl) {
        kevEl.innerHTML = `<span class="cve">${badge.code}</span><span class="vuln-title">${badge.title}</span>`;
      }
    }
  });

  currentWires.forEach(wire => {
    wire.hit = false;
    wire.defended = false;
    wire.path.setAttribute('class', 'wire');
  });

  runStats = { hits: 0, blocks: 0, ineligible: 0, truncated: 0, lakesBreached: 0, publicExposures: 0, wafBlocks: 0, soarBlocks: 0, canaryBlocks: 0 };
  isSimulating = false;
}

function triggerNodeHit(node, ev) {
  if (node.defended) return;
  if (!node.capabilities) node.capabilities = [];
  if (ev.grantedCapability && !node.capabilities.includes(ev.grantedCapability)) {
    node.capabilities.push(ev.grantedCapability);
  }
  const firstHit = !node.hit;
  node.hit = true;
  if (firstHit) {
    if (ev.finding?.kind === 'anonymous_access') runStats.publicExposures++;
    else runStats.hits++;
  }

  if (node.el) {
    node.el.classList.add('hit');
    if (firstHit && (node.layerIdx === 3 || node.isLake || node.isDb)) {
      node.el.classList.add('breach-target');
      runStats.lakesBreached++;
    }
    const kevEl = node.el.querySelector('.node-kev');
    const code = ev.finding?.cveId || (ev.credentialUsed ? 'T1078 · CREDENTIAL' : ev.technique || 'EXPLOITED');
    const capText = node.capabilities.length ? node.capabilities.join(' + ') : (ev.grantedCapability || 'access');
    const detail = `${capText} · ${ev.reason}`;
    const stepLine = `SIMULATED REACH (${ev.reachability})\nAccess: ${ev.requiredAccess}\nCapability: ${ev.grantedCapability}\n${ev.reason}${ev.finding?.sourceUrl ? `\nSource: ${ev.finding.sourceUrl}` : ''}`;
    node.el.title = firstHit ? stepLine : `${node.el.title}\n---\n${stepLine}`;
    if (kevEl) {
      kevEl.innerHTML = `<span class="cve">${code}</span><span class="vuln-title">${detail}</span>`;
    }

    if (firstHit) {
      const burst = document.createElement('div');
      burst.className = 'impact-burst';
      burst.style.left = `${node.x}px`;
      burst.style.top = `${node.y}px`;
      nodesLayer.appendChild(burst);
      safeTimeout(() => burst.remove(), 700);
    }
  }
}

function triggerNodeDefense(node, wire, ev) {
  if (node.hit || node.defended) return;
  node.defended = true;
  const mitigation = ev.mitigation;
  runStats.blocks++;
  if (mitigation.badge?.includes('WAF VIRTUAL PATCH')) runStats.wafBlocks++;
  else if (mitigation.badge?.includes('AGENTIC SOAR')) runStats.soarBlocks++;
  else if (mitigation.badge?.includes('CANARY')) runStats.canaryBlocks++;

  if (node.el) {
    node.el.classList.add('defended');
    const badgeText = mitigation.badge || 'CONTAINED';
    const subText = mitigation.control ? `${ev.finding?.cveId || ev.technique} · [${mitigation.control}]` : mitigation.reason;
    node.el.title = `${badgeText}\n${ev.reachability || ''}\n${mitigation.reason || ''}`;
    const kevEl = node.el.querySelector('.node-kev');
    if (kevEl) {
      kevEl.innerHTML = `<span class="cve">${badgeText}</span><span class="vuln-title">${subText}</span>`;
    }
  }

  if (wire) {
    wire.defended = true;
    wire.path.classList.add('defended-wire');
  }
}

function animateWirePulse(wire, onComplete) {
  const generation = simulationGeneration;
  const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  pulse.setAttribute('r', '3.5');
  pulse.setAttribute('class', 'wire-packet');
  svg.appendChild(pulse);
  wire.path.classList.add('active-wire');

  const pathEl = wire.path;
  const duration = 420;
  const startTime = performance.now();

  function step(time) {
    if (generation !== simulationGeneration) return;
    const progress = Math.min(1, (time - startTime) / duration);
    const point = pathEl.getPointAtLength(progress * pathEl.getTotalLength());
    pulse.setAttribute('cx', point.x);
    pulse.setAttribute('cy', point.y);
    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      pulse.remove();
      wire.path.classList.remove('active-wire');
      if (onComplete) onComplete();
    }
  }
  requestAnimationFrame(step);
}

function updatePresetButton() {
  presetBtn.classList.toggle('demo', currentPreset === 'demo' || currentPreset === 'logs');
  presetBtn.querySelector('span').textContent =
    currentPreset === 'demo'
      ? 'PRESET: DEMO-READY'
      : currentPreset === 'logs'
        ? 'PRESET: CRED-IN-LOGS'
        : 'PRESET: MIXED';
}

function generateNewInfra() {
  clearAllActiveTimeouts();
  const seed = Math.floor(Math.random() * 4294967296);
  currentEstate = generateEstate({ seed, preset: currentPreset });
  try { localStorage.setItem(INFRA_STORAGE_KEY, JSON.stringify(currentEstate)); } catch (e) { console.warn('Unable to save estate', e); }
  layoutGraph(currentEstate);
  runSimulationOnCurrentInfra();
}

function restoreInfra(snapshot) {
  const res = migrateSnapshot(snapshot);
  if (!res.ok) {
    console.warn(res.reason);
    generateNewInfra();
    return;
  }
  clearAllActiveTimeouts();
  currentEstate = res.estate;
  currentPreset = currentEstate.preset;
  updatePresetButton();
  layoutGraph(currentEstate);
  runSimulationOnCurrentInfra();
}

function runSimulationOnCurrentInfra() {
  if (!currentEstate) return;
  resetInfraVisuals();
  isSimulating = true;
  window.isSimulating = true;
  runCount++;
  window.runCount = runCount;

  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  runHud.className = '';
  runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · EVALUATING PREREQUISITES...`;

  const simResult = simulateEstate(currentEstate, currentMode);
  window.lastSimSummary = simResult.summary;

  const nodesById = new Map(currentNodes.map(n => [n.id, n]));
  const wiresByRelId = new Map(currentWires.map(w => [w.relationship?.id, w]));

  if (simResult.canaryAssetId) {
    const canaryNode = nodesById.get(simResult.canaryAssetId);
    if (canaryNode?.el) {
      canaryNode.el.classList.add('canary');
      canaryNode.el.querySelector('.node-label').textContent = 'CANARY · Decoy backend';
      canaryNode.el.title = 'Canary decoy: access generates an alert and triggers simulated automated containment.';
    }
  }

  // Group events by target layer for clean visual progression
  const batches = [[], [], [], []];
  simResult.events.forEach(ev => {
    const targetNode = nodesById.get(ev.targetId);
    if (!targetNode) return;
    const wire = ev.relationshipId ? wiresByRelId.get(ev.relationshipId) : null;
    batches[targetNode.layerIdx].push({ ev, node: targetNode, wire });
  });

  const nonEmptyBatches = batches.filter(b => b.length > 0);
  const generation = simulationGeneration;

  function playBatch(idx) {
    if (generation !== simulationGeneration) return;
    if (idx >= nonEmptyBatches.length) {
      finalizeSimulation(simResult);
      return;
    }
    const batch = nonEmptyBatches[idx];
    let remaining = batch.length;
    const complete = () => {
      if (generation !== simulationGeneration) return;
      if (--remaining === 0) safeTimeout(() => playBatch(idx + 1), 160);
    };

    batch.forEach(({ ev, node, wire }) => {
      revealNodeWires(node);
      const apply = () => {
        if (generation !== simulationGeneration) return;
        recordSocTicket(node, ev);
        if (ev.outcome === 'ineligible') {
          runStats.ineligible++;
          if (node.el && !node.hit && !node.defended) {
            node.el.title += `\nBlocked prerequisite: ${ev.reason}`;
          }
        } else if (ev.outcome === 'truncated') {
          runStats.truncated++;
        } else if (ev.outcome === 'blocked') {
          triggerNodeDefense(node, wire, ev);
        } else if (ev.outcome === 'succeeded') {
          if (wire) { wire.hit = true; wire.path.classList.add('hit-wire'); }
          triggerNodeHit(node, ev);
        } else if (ev.outcome === 'revisit' && wire && node.defended) {
          wire.defended = true; wire.path.classList.add('defended-wire');
        }
        complete();
      };

      if (wire && (ev.outcome === 'succeeded' || ev.outcome === 'blocked')) {
        animateWirePulse(wire, apply);
      } else if (!wire && (ev.outcome === 'succeeded' || ev.outcome === 'blocked')) {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        line.setAttribute('class', 'attack-entry');
        line.setAttribute('d', `M -20 ${node.y} L ${Math.max(8, node.x - 24)} ${node.y}`);
        svg.appendChild(line);
        safeTimeout(() => line.remove(), 650);
        safeTimeout(apply, 500);
      } else {
        safeTimeout(apply, 120);
      }
    });
  }

  playBatch(0);
}

function finalizeSimulation(simResult) {
  if (!socLooping) {
    socLooping = true;
    renderSocTickets();
  }
  isSimulating = false;
  window.isSimulating = false;
  window.runStats = runStats;

  const s = simResult.summary;
  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  const presetTag = s.preset === 'logs' ? 'CRED-IN-LOGS' : 'DEMO-READY';
  const prefix = s.intentionalPathNote ? `[${scn.tag} · ${presetTag}]` : `[${scn.tag}]`;
  const pathStatus = s.dataReached
    ? 'DATA TARGET REACHED'
    : s.truncated ? 'EXPLORATION INCOMPLETE' : 'NO MODELED DATA PATH FOUND';

  runHud.className = s.dataReached ? 'breached' : 'contained';
  runHud.textContent = `${prefix} RUN #${String(runCount).padStart(2, '0')} · ${runStats.hits} COMPROMISED · ${runStats.blocks} CONTAINED · ${s.ineligibleTransitions} STOPPED · ${pathStatus}`;
  if (s.truncated) runHud.textContent += ' · BUDGET TRUNCATED';
  if (currentMode === 'combined') {
    runHud.textContent += ` · WAF ${runStats.wafBlocks} / SOAR ${runStats.soarBlocks} / CANARY ${runStats.canaryBlocks}`;
  }

  if (window._onSimulationDone) {
    window._onSimulationDone({
      run: runCount,
      scenario: currentMode,
      preset: s.preset,
      hits: runStats.hits,
      blocks: runStats.blocks,
      ineligible: s.ineligibleTransitions,
      truncated: s.truncated,
      publicExposures: runStats.publicExposures,
      wafBlocks: runStats.wafBlocks,
      soarBlocks: runStats.soarBlocks,
      canaryBlocks: runStats.canaryBlocks,
      lakesBreached: runStats.lakesBreached,
      completeFourLayerPath: s.completeFourLayerPath,
      status: s.dataReached ? 'DATA REACHED' : s.truncated ? 'INCOMPLETE' : 'NO MODELED PATH FOUND'
    });
  }
}

const modeButtons = document.querySelectorAll('.mode-btn');
modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    currentMode = btn.dataset.mode;
    try { localStorage.setItem('artex-wire-mode', currentMode); } catch (e) {}
    modeButtons.forEach(b => b.classList.toggle('selected', b === btn));
    runSimulationOnCurrentInfra();
  });
});

presetBtn.addEventListener('click', () => {
  currentPreset = currentPreset === 'mixed' ? 'demo' : currentPreset === 'demo' ? 'logs' : 'mixed';
  try { localStorage.setItem(PRESET_STORAGE_KEY, currentPreset); } catch (e) {}
  updatePresetButton();
  generateNewInfra();
});

newRunBtn.addEventListener('click', () => generateNewInfra());

window.addEventListener('resize', () => {
  if (currentEstate) {
    layoutGraph(currentEstate);
    runSimulationOnCurrentInfra();
  }
});

window.addEventListener('load', () => {
  try {
    const mode = localStorage.getItem('artex-wire-mode');
    if (mode && DEFENSE_SCENARIOS[mode]) {
      currentMode = mode;
      modeButtons.forEach(btn => btn.classList.toggle('selected', btn.dataset.mode === mode));
    }
    const savedPreset = localStorage.getItem(PRESET_STORAGE_KEY);
    if (savedPreset === 'demo' || savedPreset === 'mixed' || savedPreset === 'logs') currentPreset = savedPreset;
    updatePresetButton();

    const snapshot = JSON.parse(localStorage.getItem(INFRA_STORAGE_KEY));
    if (snapshot) { restoreInfra(snapshot); return; }
  } catch (e) { console.warn('Unable to restore infrastructure', e); }
  generateNewInfra();
});
</script>
</body>
</html>
