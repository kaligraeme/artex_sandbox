<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARTEX | Wire Diagram Simulation v2.4.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
  :root {
    --bg: #071426;
    --turquoise: #00f0ff;
    --turquoise-glow: rgba(0, 240, 255, 0.45);
    --green: #00ff77;
    --green-glow: rgba(0, 255, 119, 0.65);
    --green-wire: rgba(0, 255, 119, 0.48);
    --red: #ff2244;
    --red-glow: rgba(255, 34, 68, 0.85);
    --red-wire: #ff2244;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg);
    color: #fff;
    font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', Consolas, monospace;
  }

  /* Full screen canvas and graph viewport */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 45%, #10253b 0%, #071426 75%, #050f1e 100%);
    overflow: hidden;
  }

  /* Faint background grid for circuit cyber aesthetic */
  .circuit-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0, 255, 119, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 119, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  /* TOP HEADER - Mode selection strip + NEW RUN + Live HUD */
  .top-bar {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 0 12px;
    z-index: 1000;
    pointer-events: none;
  }

  /* 4 Run Type Scenario Buttons along the top */
  .mode-strip {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  .mode-btn {
    background: rgba(9, 16, 24, 0.88);
    border: 1px solid rgba(88, 217, 219, 0.22);
    color: #8fa3b8;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    backdrop-filter: blur(8px);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    text-align: left;
  }

  .mode-btn:hover {
    border-color: var(--turquoise);
    color: #e6edf5;
    background: rgba(14, 28, 38, 0.95);
    transform: translateY(-1px);
  }

  .mode-btn.selected {
    background: rgba(0, 36, 44, 0.95);
    border-color: var(--turquoise);
    color: var(--turquoise);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.15);
  }

  .mode-btn .mode-title {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #abbecd;
  }

  .mode-btn.selected .mode-title {
    color: var(--turquoise);
  }

  .mode-btn .mode-desc {
    font-size: 7.5px;
    letter-spacing: 0.05em;
    color: #64788c;
    white-space: nowrap;
  }

  .mode-btn.selected .mode-desc {
    color: #8bebf0;
  }

  .run-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  #catalog-example {
    color: #a5d8ff;
    background: rgba(4, 18, 32, 0.88);
    border: 1px solid rgba(110, 193, 255, 0.35);
    border-radius: 3px;
    padding: 3px 8px;
    font-size: 10px;
    text-align: center;
    pointer-events: auto;
  }

  #run-hud {
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--turquoise);
    background: rgba(0, 16, 22, 0.8);
    border: 1px solid rgba(0, 240, 255, 0.25);
    padding: 4px 9px;
    border-radius: 3px;
    backdrop-filter: blur(6px);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    transition: all 0.3s ease;
    text-align: center;
  }
  #run-hud.breached {
    color: #ff9ba8;
    border-color: rgba(255, 34, 68, 0.4);
    text-shadow: 0 0 4px rgba(255, 34, 68, 0.3);
    background: rgba(26, 4, 8, 0.85);
  }
  #run-hud.contained {
    color: #65d7a5;
    border-color: rgba(101, 215, 165, 0.4);
    text-shadow: 0 0 8px rgba(101, 215, 165, 0.6);
    background: rgba(4, 20, 14, 0.85);
  }

  /* SVG layer for wires and pulses */
  #wire-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .wire {
    fill: none;
    stroke: var(--green-wire);
    stroke-width: 1.25;
    stroke-linecap: round;
    opacity: 0.22;
    transition: opacity 0.8s ease, stroke 0.4s ease, stroke-width 0.3s ease, filter 0.3s ease, stroke-opacity 0.4s ease;
  }

  .wire.revealed, .wire.hit-wire, .wire.defended-wire { opacity: 1; }
  .wire.contained-wire {
    opacity: 1;
    stroke: #f6b93b;
    stroke-width: 2;
    stroke-dasharray: 5 4;
  }
  .node.catalog-focus .node-label {
    outline: 1px solid rgba(121, 189, 255, 0.75);
    outline-offset: 2px;
  }
  .node.decoy .node-halo {
    border-color: #f6b93b;
    opacity: 0.75;
  }
  .node.decoy .node-icon {
    background-color: #f6b93b;
    filter: drop-shadow(0 0 6px rgba(246, 185, 59, 0.6));
  }
  .node.decoy .node-label {
    color: #ffe6a3;
    border: 1px dashed rgba(246, 185, 59, 0.55);
  }
  .node.contained .node-halo {
    border-color: #f6b93b;
    opacity: 0.9;
  }
  .node.contained .node-icon {
    background-color: #f6b93b;
    filter: drop-shadow(0 0 8px rgba(246, 185, 59, 0.75));
  }
  .node.contained .node-kev,
  .node.contained .cve {
    display: block;
    color: #ffd37a;
  }
  .illustrative-wire {
    fill: none;
    stroke: #c2a2fa;
    stroke-width: 1.5;
    stroke-dasharray: 4 5;
    opacity: 0.4;
  }
  .illustrative-step {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 15vw;
    max-width: 142px;
    padding: 5px 3px;
    border: 1px dashed #9174bd;
    border-radius: 4px;
    background: #18142b;
    color: #e2d2ff;
    font-size: 10px;
    text-align: center;
    pointer-events: auto;
    opacity: 0.65;
  }
  .illustration-active .illustrative-step,
  .illustration-active .illustrative-wire { opacity: 1; }

  .probe-wire {
    fill: none;
    stroke: #ff637b;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 2 6;
    animation: probeSweep linear both;
  }
  .probe-wire[data-lane="2"] { stroke: #ffac7b; }
  .probe-wire[data-lane="3"] { stroke: #d3a0ff; }
  @keyframes probeSweep {
    0% { opacity: 0; }
    15%, 70% { opacity: 1; }
    100% { opacity: 0; stroke-dashoffset: -24; }
  }

  .wire.hit-wire {
    stroke: var(--red);
    stroke-opacity: 0.95;
    stroke-width: 2.2;
    filter: drop-shadow(0 0 6px var(--red-glow));
    stroke-dasharray: none;
  }

  /* Traveling energy packet along wires */
  .wire-packet {
    fill: var(--red);
    filter: drop-shadow(0 0 6px var(--red));
  }

  /* DOM Nodes Layer */
  #nodes-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
  }

  /* Smaller, sleek node items */
  .node {
    position: absolute;
    /* Anchor the 36px icon, not the combined icon-and-label box, at x/y. */
    transform: translate(-50%, -18px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .node:hover {
    transform: translate(-50%, -18px) scale(1.15);
    transform-origin: center 18px;
    z-index: 100;
  }

  /* Node Icon Box - Smaller */
  .node-icon-wrapper {
    position: relative;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Ambient glowing ring around icon */
  .node-halo {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px dashed var(--green);
    opacity: 0.35;
    transition: all 0.4s ease;
    animation: rotateSlow 25s linear infinite;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* The Icon itself using pure CSS Mask: smaller, crisp, transparent */
  .node-icon {
    width: 26px;
    height: 26px;
    background-color: var(--green);
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    filter: drop-shadow(0 0 5px var(--green-glow));
    transition: background-color 0.4s ease, filter 0.4s ease, transform 0.3s ease;
  }

  /* Node Label - Very Light Green for maximum legibility */
  .node-label {
    margin-top: 4px;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #d4ffe8;
    text-shadow: none;
    background: #071426;
    border-radius: 2px;
    padding: 1px 3px;
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: center;
    width: max-content;
    max-width: 150px;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  /* KEV Title underneath in RED (hidden initially, displays on hit) */
  .node-kev {
    margin-top: 3px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #ff9ba8;
    text-shadow: 0 0 3px rgba(255, 34, 68, 0.25);
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: center;
    width: max-content;
    max-width: 160px;
    background: #2d060c;
    border: 1px solid rgba(255, 34, 68, 0.55);
    border-radius: 3px;
    padding: 2px 5px;
    opacity: 0;
    transform: translateY(-3px) scale(0.9);
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 34, 68, 0.3);
  }

  .node-kev .cve {
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  .node-kev .vuln-title {
    display: block;
    font-size: 8px;
    opacity: 1;
    font-weight: 600;
  }

  .canary-marker {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    padding: 2px 4px;
    color: #ffe45c;
    background: #221a0a;
    border: 1px solid #ad8333;
    border-radius: 3px;
    font-size: 8px;
    white-space: nowrap;
  }

  /* HIT STATE: Lit in RED */
  .node.hit .node-icon {
    background-color: var(--red);
    filter: drop-shadow(0 0 12px var(--red-glow)) drop-shadow(0 0 20px var(--red));
    transform: scale(1.1);
  }

  .node.hit .node-halo {
    border-color: var(--red);
    border-style: solid;
    opacity: 0.85;
    box-shadow: 0 0 12px var(--red-glow);
    animation: hitPulse 1.2s ease-out infinite alternate;
  }

  .node.hit .node-label {
    color: #ffadb8;
    text-shadow: 0 0 4px rgba(255, 34, 68, 0.3);
  }

  .node.hit, .node.defended {
    z-index: 10;
  }

  .node.hit .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* DEFENDED / BLOCKED STATE */
  .node.defended .node-icon {
    background-color: #f3bd64;
    filter: drop-shadow(0 0 10px rgba(243, 189, 100, 0.8));
    transform: scale(1.05);
  }
  .node.defended .node-halo {
    border-color: #f3bd64;
    border-style: double;
    opacity: 0.85;
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.5);
  }
  .node.defended .node-label {
    color: #f3bd64;
    text-shadow: 0 0 6px rgba(243, 189, 100, 0.6);
  }
  .node.defended .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
    color: #f3bd64;
    border-color: rgba(243, 189, 100, 0.6);
    background: #1e1606;
    text-shadow: 0 0 8px rgba(243, 189, 100, 0.5);
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.3);
  }

  /* DATABASE CLUSTER BREACH TARGET */
  .node.breach-target .node-icon {
    background-color: #ff003c;
    filter: drop-shadow(0 0 16px #ff003c) drop-shadow(0 0 28px #ff003c);
    animation: breachShake 0.4s ease infinite alternate;
  }
  .node.breach-target .node-kev {
    border-color: #ff003c;
    background: #32000c;
    box-shadow: 0 0 16px rgba(255, 0, 60, 0.7);
  }

  @keyframes breachShake {
    0% { transform: scale(1.12) rotate(-2deg); }
    100% { transform: scale(1.15) rotate(2deg); }
  }

  .wire.defended-wire {
    stroke: #765d34 !important;
    stroke-opacity: 0.7 !important;
    stroke-dasharray: 4 4 !important;
  }

  @keyframes hitPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.22); opacity: 0.3; }
  }

  /* Small incident-ticket drum in the bottom-right corner. */
  .soc-ticker { position: fixed; z-index: 30; right: 8px; bottom: 8px; width: clamp(170px, 14vw, 225px); height: 108px; overflow: hidden; pointer-events: none; font: 10px Arial, sans-serif; }
  .soc-cards { display: flex; flex-direction: column; gap: 0; }
  .soc-cards { transition: transform 2.8s ease-in-out; }
  .soc-cards.looping { transition: none; animation: socLoop var(--soc-loop-duration) linear infinite; }
  @keyframes socLoop { from { transform: translateY(0); } to { transform: translateY(-50%); } }
  .soc-card { flex: 0 0 36px; height: 36px; box-sizing: border-box; overflow: hidden; background: #fff; border: 1px solid #2871b9; border-left: 3px solid #2871b9; color: #132d48; padding: 2px 5px; }
  .soc-card-head { display: flex; justify-content: space-between; gap: 4px; font-weight: bold; border-bottom: 1px solid #9cbfe0; padding-bottom: 2px; }
  .soc-title, .soc-detail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .soc-detail { margin-top: 2px; color: #284967; font-size: 9px; }
  .soc-severity { flex: none; font-size: 9px; color: #a12e24; }
  .soc-empty { color: #58728c; }
  .elapsed-clock {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    color: #a9bfd2;
    font-size: 10px;
    white-space: nowrap;
  }
  #model-clock { min-width: 12ch; color: #e2f6ff; font-size: 12px; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .soc-cards { transition: none; } .soc-cards.looping { animation: none; } }

  .run-row label { display: flex; align-items: center; gap: 6px; color: #a9bfd2; font-size: 11px; }
  .run-row select, .run-row button.trace-control {
    padding: 6px 8px;
    border: 1px solid rgba(88, 217, 219, 0.3);
    border-radius: 4px;
    background: #0c1928;
    color: #d0e4f2;
    color-scheme: dark;
    font: inherit;
    cursor: pointer;
  }
  .run-row select:focus-visible, .run-row button.trace-control:focus-visible { outline: 2px solid var(--turquoise); }

</style>
</head>
<body>

<main id="viewport" aria-label="ARTEX Wire Diagram">
  <div class="circuit-grid"></div>

  <div class="top-bar">
    <div class="mode-strip" role="group" aria-label="Defense scenario run types">
      <button class="mode-btn selected" data-mode="baseline" aria-pressed="true">
        <span class="mode-title">01 / BASELINE</span>
        <span class="mode-desc">No active controls</span>
      </button>
      <button class="mode-btn" data-mode="patch" aria-pressed="false">
        <span class="mode-title">02 / VIRTUAL PATCH</span>
        <span class="mode-desc">Edge WAF</span>
      </button>
      <button class="mode-btn" data-mode="canaries" aria-pressed="false">
        <span class="mode-title">03 / CANARIES</span>
        <span class="mode-desc">Decoy alert only</span>
      </button>
      <button class="mode-btn" data-mode="soc" aria-pressed="false">
        <span class="mode-title">04 / AGENTIC SOAR</span>
        <span class="mode-desc">Detect and contain</span>
      </button>
      <button class="mode-btn" data-mode="soc-canary" aria-pressed="false">
        <span class="mode-title">05 / AGENTIC SOAR + CANARY</span>
        <span class="mode-desc">Containment with a decoy signal</span>
      </button>
    </div>

    <div class="run-row">
      <button id="new-run-btn" class="trace-control" type="button" title="Generate a fresh topology">New Infra</button>
      <label>
        Attacker
        <select id="map-profile">
          <option value="pre2023">Pre-2023</option>
          <option value="artex" selected>ARTEX-like</option>
        </select>
      </label>
      <button id="map-replay-btn" class="trace-control" type="button">Replay</button>
      <button id="map-results-btn" class="trace-control" type="button">Results</button>
      <div class="elapsed-clock" role="timer" aria-label="Modeled elapsed time">
        <span>Elapsed</span><strong id="model-clock">0 min</strong>
      </div>
    </div>
    <div id="catalog-example" hidden></div>
    <div id="run-hud" role="status"></div>
  </div>

  <div class="soc-ticker" aria-label="Simulated SOC tickets">
    <div id="soc-cards" class="soc-cards" aria-live="off"></div>
  </div>

  <!-- Fullscreen SVG for wires & pulses -->
  <svg id="wire-svg"></svg>

  <!-- HTML nodes layer for GPU accelerated icon masking and text -->
  <div id="nodes-layer"></div>
</main>

<script src="js/wire-engine.js"></script>
<script>
const {
  cveTooltip,
  generateEstate,
  referenceServiceFlow,
  simulateWireRun
} = window.WireEngine;

const ICON_BASE = 'assets/diagram-icons/transparent/';
const svg = document.getElementById('wire-svg');
const nodesLayer = document.getElementById('nodes-layer');
const catalogLabel = document.getElementById('catalog-example');
const runHud = document.getElementById('run-hud');
const mapProfile = document.getElementById('map-profile');
const modeButtons = document.querySelectorAll('.mode-btn');
const clock = document.getElementById('model-clock');
let currentNodes = new Map();
let currentWires = new Map();

// Tickets are illustrative scenario events; severity is estimated, not a CVSS score.
const socTickets = new Map();
let socLooping = false;
function renderSocTickets() {
  const cards = document.getElementById('soc-cards');
  const tickets = [...socTickets.values()];
  cards.replaceChildren();
  const loop = socLooping && tickets.length > 3;
  cards.classList.toggle('looping', loop);
  cards.style.setProperty('--soc-loop-duration', `${Math.max(24, tickets.length * 5)}s`);
  cards.style.transform = loop ? '' : `translateY(-${Math.max(0, tickets.length - 3) * 36}px)`;
  const displayed = loop ? [...tickets, ...tickets] : tickets;
  displayed.forEach((ticket, index) => {
    const card = document.createElement('div');
    card.className = 'soc-card';
    if (index >= tickets.length) card.setAttribute('aria-hidden', 'true');
    const head = document.createElement('div'); head.className = 'soc-card-head';
    const title = document.createElement('span'); title.className = 'soc-title'; title.textContent = ticket.title;
    const severity = document.createElement('span'); severity.className = 'soc-severity'; severity.textContent = ticket.severity;
    const detail = document.createElement('div'); detail.className = 'soc-detail'; detail.textContent = ticket.detail;
    head.append(title, severity); card.append(head, detail); cards.appendChild(card);
  });
}

function getDefaultNodeBadge(asset, findings) {
  if (!findings.length) {
    return { code: 'NO FINDING', title: 'No finding modeled; security status is unknown' };
  }
  const f = findings[0];
  if (f.category === 'external_misconfiguration') {
    return { code: 'EXTERNAL MISCONFIGURATION', title: f.title };
  }
  if (f.kind === 'cve') {
    return { code: `${f.cveId}${f.inKev ? ' · KEV' : ''}`, title: f.title };
  }
  if (f.kind === 'diagnostic_access') {
    return { code: f.title.toUpperCase(), title: 'Signed-in diagnostics viewer' };
  }
  if (f.kind === 'exercise') return { code: f.technique || 'SIMULATED FINDING', title: f.title };
  if (f.kind === 'anonymous_access') {
    return { code: `${f.technique} · PUBLIC`, title: f.title };
  }
  if (f.kind === 'password_spray') {
    return { code: `${f.technique} · SPRAY`, title: f.mfaProtected ? 'MFA enforced' : 'No MFA/lockout' };
  }
  return { code: f.technique || 'FINDING', title: f.title };
}

function formatAssetTooltip(asset, findings, credentials) {
  const lines = [
    `${asset.label} (${asset.trustZone})`,
    `Interfaces: ${asset.interfaces.join(', ')}`
  ];
  if (!findings.length) {
    lines.push('No finding modeled; security status is unknown.');
    if (asset.referenceCve) lines.push(`Product advisory reference: ${asset.referenceCve}`);
  } else {
    findings.forEach(f => {
      lines.push(`Finding [${f.provenance}]: ${f.cveId ? f.cveId + ' · ' : ''}${f.title}`);
      if (f.historicalReference) lines.push(`Reference: ${f.historicalReference}`);
      if (f.sourceUrl) lines.push(`Source: ${f.sourceUrl} (reviewed ${f.sourceReviewed}); deployment and outcome are synthetic.`);
    });
  }
  if (credentials.length) {
    credentials.forEach(c => {
      lines.push(c.startingAccess
        ? `Starting access: ${c.label} · ${c.scope}`
        : `Stored credential: ${c.label} (requires ${c.requiredSourceCapability})`);
    });
  }
  return lines.join('\n');
}

function layoutGraph(estate) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const gitExample = estate.findings.find(finding => finding.illustration === 'git-to-idp');
  const graphTop = Math.min(h * 0.4, document.querySelector('.top-bar').getBoundingClientRect().bottom + 65);
  const graphBottom = Math.max(graphTop + 1, h - (gitExample ? 155 : 65));
  const graphHeight = graphBottom - graphTop;

  currentWires.clear();
  nodesLayer.innerHTML = '';
  svg.innerHTML = '';
  document.getElementById('viewport').classList.remove('illustration-active');

  const nodes = estate.assets.map(asset => {
    const displayLabel = asset.isDecoy ? `${asset.label} · Decoy` : asset.label;
    const findings = estate.findings.filter(f => f.assetId === asset.id);
    const creds = estate.credentials.filter(c => c.sourceAssetId === asset.id);
    return {
      ...asset,
      label: displayLabel,
      findings,
      creds,
      x: asset.x * w,
      y: graphTop + asset.y * graphHeight,
      downstream: [],
      hit: false,
      defended: false,
      el: null
    };
  });

  currentNodes = new Map(nodes.map(node => [node.id, node]));
  estate.relationships.forEach(rel => {
    const source = currentNodes.get(rel.sourceId);
    const target = currentNodes.get(rel.targetId);
    if (!source || !target) return;
    source.downstream.push(target.id);
    createWire(source, target, rel);
  });

  nodes.forEach(node => {
    const el = document.createElement('div');
    el.className = node.isDecoy ? 'node decoy' : 'node';
    el.id = 'node-' + node.id;
    if (node.referenceCve) el.dataset.appliance = node.groupId;
    el.title = formatAssetTooltip(node, node.findings, node.creds);
    el.style.left = `${node.x}px`;
    el.style.top = `${node.y}px`;

    const badge = getDefaultNodeBadge(node, node.findings);
    el.innerHTML = `
      <div class="node-icon-wrapper">
        <div class="node-halo"></div>
        <div class="node-icon" style="-webkit-mask-image: url('${ICON_BASE}${node.icon}'); mask-image: url('${ICON_BASE}${node.icon}');"></div>
      </div>
      <div class="node-label">${node.label}</div>
      <div class="node-kev">
        <span class="cve">${badge.code}</span>
        <span class="vuln-title">${badge.title}</span>
      </div>
    `;
    el.addEventListener('click', () => revealNodeWires(node, 4000));
    nodesLayer.appendChild(el);
    node.el = el;
  });

  if (gitExample) drawGitIllustration(currentNodes.get(gitExample.assetId), w, h - 127);
  if (referenceCase) markReferenceFlow(estate, referenceCase);
}

function markReferenceFlow(estate, { context, example }) {
  const flow = referenceServiceFlow(estate, context.groups);
  if (!flow) return;

  const vendorToken = (example?.vendor || '').toLowerCase();
  const productToken = (example?.product || '').toLowerCase();
  flow.assets.forEach((id, index) => {
    const node = currentNodes.get(id);
    const el = node.el;
    el.title += `\nReference KEV Context · ${context.roles[index]}`;
    const labelLower = node.label.toLowerCase();
    const matchesVendor = !vendorToken || labelLower.includes(vendorToken) || labelLower.includes(productToken) || node.groupId === context.groups[index];
    if (index === context.focus && matchesVendor) {
      el.classList.add('catalog-focus');
      el.title += `\n${context.defensiveFocus}`;
    }
  });
}

function drawGitIllustration(proxy, width, y) {
  const steps = ['Git repository access', 'CI runner access', 'Higher-privilege runner', 'IdP admin access'];
  let previous = proxy;
  for (const [index, label] of steps.entries()) {
    const x = width * (0.29 + index * 0.18);
    const wire = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    wire.setAttribute('class', 'illustrative-wire');
    wire.setAttribute('d', `M ${previous.x} ${previous.y} L ${x} ${y}`);
    svg.appendChild(wire);

    const node = document.createElement('div');
    node.className = 'illustrative-step';
    node.style.left = `${x}px`;
    node.style.top = `${y}px`;
    node.title = `Illustrative branch · ${label}`;
    node.textContent = label;
    nodesLayer.appendChild(node);
    previous = { x, y };
  }
}

function createWire(source, target, relationship) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'wire');
  svg.appendChild(path);
  const wire = { source, target, path };
  path.setAttribute('d', `M ${source.x} ${source.y} L ${target.x} ${target.y}`);
  currentWires.set(relationship.id, wire);
}

function revealNodeWires(node, duration = 1200) {
  for (const wire of currentWires.values()) {
    if (wire.source.id !== node.id && wire.target.id !== node.id) continue;
    const revealId = (wire.revealId || 0) + 1;
    wire.revealId = revealId;
    wire.path.classList.add('revealed');
    setTimeout(() => {
      if (wire.revealId === revealId) wire.path.classList.remove('revealed');
    }, duration);
  }
}

let estate = generateEstate({ seedExercise: true });
let catalog;
let catalogDeck = [];
let referenceCase = null;
const pre2023Groups = { lockbit: 'LockBit', conti: 'Conti', blackcat: 'BlackCat', hive: 'Hive', revil: 'REvil' };
let pre2023Deck = [];
let pre2023Group;
let defense = 'baseline';
let run;
let phases = [];
let phaseIndex = 0;
let modeledTime = 0;
let frame;

const PROBE_MS = 340;

function formatEstimate(seconds) {
  if (seconds === 0) return 'At start';
  if (seconds < 60) return '<1 min';
  const minutes = Math.round(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const remainder = minutes % 60;
  if (!hours) return `~${minutes} min`;
  return `~${hours} hr${remainder ? ` ${remainder} min` : ''}`;
}

function animatePulse(wire) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ns = 'http://www.w3.org/2000/svg';
  const pulse = document.createElementNS(ns, 'circle');
  pulse.setAttribute('class', 'wire-packet');
  pulse.setAttribute('r', '3.5');
  const motion = document.createElementNS(ns, 'animateMotion');
  motion.setAttribute('path', wire.path.getAttribute('d'));
  motion.setAttribute('dur', '420ms');
  motion.setAttribute('begin', 'indefinite');
  motion.addEventListener('endEvent', () => pulse.remove(), { once: true });
  pulse.appendChild(motion);
  svg.appendChild(pulse);
  motion.beginElement();
}

function showProbes(events, laneCount) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return 0;
  const candidates = new Map(events.filter(event => !event.control)
    .map(event => [event.relationshipId ?? event.targetId, event]));
  let index = 0;
  for (const event of candidates.values()) {
    const target = currentNodes.get(event.targetId);
    const wire = currentWires.get(event.relationshipId);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'probe-wire');
    path.setAttribute('d', wire
      ? wire.path.getAttribute('d')
      : `M 0 ${target.y} L ${target.x} ${target.y}`);

    path.dataset.lane = String(index % laneCount + 1);
    path.style.animationDelay = `${Math.floor(index++ / laneCount) * PROBE_MS}ms`;
    path.style.animationDuration = `${PROBE_MS}ms`;
    path.addEventListener('animationend', () => path.remove(), { once: true });
    svg.appendChild(path);
  }
  return Math.ceil(candidates.size / laneCount) * PROBE_MS;
}

function renderEvent(event, time, animate) {
  const node = currentNodes.get(event.targetId);
  const wire = currentWires.get(event.relationshipId);
  const success = event.outcome === 'succeeded';
  const blocked = event.outcome === 'blocked';
  const contained = event.outcome === 'contained';
  const alertOnly = event.outcome === 'alert_only';
  const read = event.grantedCapability === 'data_read' && node.layerIdx === 3 && !node.isDecoy;
  const staging = node.groupId === 'staging-status';
  const finding = event.finding;
  const diagnostic = finding?.kind === 'diagnostic_access';
  const reference = finding?.cveId || event.technique;
  const action = finding?.title || (event.credentialUsed ? 'Valid Accounts' : 'Access check');
  const summary = reference ? `${action} · ${reference}` : action;
  node.el.title += `\n${formatEstimate(time)} · ${summary} · ${event.reason}`;
  if (!success && !blocked && !contained && !alertOnly) return;

  let result = 'ACCESS ESTABLISHED';
  if (blocked) result = event.mitigation?.badge || 'BLOCKED';
  else if (contained) result = 'CONTAINED BY AGENTIC SOC';
  else if (alertOnly) result = 'CANARY ALERT (NO CONTAINMENT)';
  else if (read) result = 'PROTECTED RECORD READ';
  else if (diagnostic) result = 'STAGING CREDENTIAL EXPOSED';
  else if (finding?.illustration === 'git-to-idp') {
    result = 'GIT TOKEN IN EXPOSED LOGS';
    document.getElementById('viewport').classList.add('illustration-active');
  }
  else if (staging) result = 'STAGING STATUS ONLY';
  else if (finding?.category === 'external_misconfiguration') result = 'EDGE ACCESS ONLY';
  else if (finding?.kind === 'anonymous_access') result = 'PUBLIC ACCESS CONFIRMED';
  else if (event.grantedCapability === 'file_read') result = 'FILE READ ONLY';

  if (success || !node.el.classList.contains('hit')) {
    node.el.classList.toggle('hit', success);
    node.el.classList.toggle('defended', blocked);
    node.el.classList.toggle('contained', contained || alertOnly);
    if (read) node.el.classList.add('breach-target');
    node.el.querySelector('.cve').textContent = result;
    node.el.querySelector('.vuln-title').textContent = summary;
  }
  if (wire) {
    if (blocked) wire.path.classList.add('defended-wire');
    else if (contained || alertOnly) wire.path.classList.add('contained-wire');
    else wire.path.classList.add('hit-wire');
    if (animate && success) animatePulse(wire);
  }
  socTickets.set(`${node.id}-${event.outcome}`, {
    title: summary,
    severity: read ? 'CRITICAL' : (blocked || contained || alertOnly) ? 'HIGH' : 'INFO',
    detail: `${formatEstimate(time)} · ${result}`
  });
}

function renderControl(event) {
  const node = currentNodes.get(event.targetId);
  const title = event.control === 'enforced' ? 'SOAR containment effective'
    : event.control === 'decision' ? 'SOAR containment approved'
    : event.source === 'canary' ? 'Canary alerted' : 'Boundary telemetry';
  if (event.control === 'signal' && event.source === 'canary') {
    const marker = document.createElement('span');
    marker.className = 'canary-marker';
    marker.textContent = 'Canary alert';
    node.el.append(marker);
  }
  const entry = currentNodes.get(event.scope);
  const detail = `${formatEstimate(event.timeSec)} · Session via ${entry.label}`;
  node.el.title += `\n${title} · ${detail}`;
  socTickets.set(`${event.scope}-${event.control}-${event.source}`, { title, severity: 'HIGH', detail });
}

function showTime(time) {
  modeledTime = time;
  const elapsed = time === 0 ? '0 min' : formatEstimate(time);
  if (clock.textContent !== elapsed) clock.textContent = elapsed;
}

function renderPhase(phase, animate = false) {
  for (const event of phase.events) {
    if (event.control) renderControl(event);
    else renderEvent(event, phase.time, animate);
  }
  renderSocTickets();
}

function resetGraph() {
  layoutGraph(estate);
  socTickets.clear();
  renderSocTickets();
}

function finishRun() {
  cancelAnimationFrame(frame);
  svg.querySelectorAll('.probe-wire').forEach(path => path.remove());
  for (; phaseIndex < phases.length; phaseIndex++) renderPhase(phases[phaseIndex]);
  showTime(phases.at(-1)?.time ?? 0);
  socLooping = true;
  renderSocTickets();
  const { dataReached, truncated, layerSuccessCounts, blockedTransitions, containedSessions } = run.summary;
  const successes = run.events.filter(event => event.outcome === 'succeeded');
  const read = successes.find(event => {
    const n = currentNodes.get(event.targetId);
    return event.grantedCapability === 'data_read' && n?.layerIdx === 3 && !n?.isDecoy;
  });
  const milestone = read ?? successes.at(-1);
  const asset = milestone && currentNodes.get(milestone.targetId);
  const evidence = milestone?.finding?.cveId || milestone?.technique;
  const sampleLogs = successes.find(event => event.finding?.technique === 'T1552.001');
  const result = read ? `Protected record read at ${asset.label} (${formatEstimate(read.timeSec)})`
    : asset ? `Reached ${asset.label} (${formatEstimate(milestone.timeSec)})`
    : 'No access established';
  const limit = dataReached ? '' : truncated ? 'Exploration limit reached' : 'No protected record read';
  const count = layerSuccessCounts[0];
  const containments = run.controls.filter(event => event.control === 'enforced');
  const canarySignals = run.controls.filter(event => event.control === 'signal' && event.source === 'canary');
  const late = read && containments.some(event => event.scope === read.scope && event.timeSec >= read.timeSec);
  const response = late ? 'SOAR contained after the read'
    : containments.length ? `${containments.length} ${containments.length === 1 ? 'session' : 'sessions'} contained`
    : defense === 'canaries' ? (canarySignals.length ? 'Canary alerted (alert only)' : 'Canary untouched')
    : defense.startsWith('soc') ? 'No matching signal' : '';
  runHud.className = dataReached ? 'breached' : 'contained';
  const illustration = run.events.some(event => event.outcome === 'succeeded' && event.finding?.illustration === 'git-to-idp')
    ? 'Illustrative branch ends at IdP admin' : '';
  const group = run.lanes === 1 ? pre2023Groups[pre2023Group] : '';
  runHud.textContent = [group, result, evidence, limit, sampleLogs?.finding.title, `${count} external ${count === 1 ? 'entry' : 'entries'} reached`,
    blockedTransitions ? `${blockedTransitions} blocked` : '', containedSessions && !containments.length ? `${containedSessions} contained` : '', response, illustration].filter(Boolean).join(' · ');
}

function playRun() {
  cancelAnimationFrame(frame);
  const attackerId = mapProfile.value === 'pre2023' ? (pre2023Group ??= drawPre2023Group()) : 'artex';
  run = simulateWireRun(estate, defense, attackerId);
  const grouped = new Map();
  for (const event of [...run.events, ...run.controls]) {
    if (!grouped.has(event.timeSec)) grouped.set(event.timeSec, []);
    grouped.get(event.timeSec).push(event);
  }
  phases = [...grouped].sort(([a], [b]) => a - b)
    .map(([time, events]) => ({ time, events }));
  phaseIndex = 0;
  socLooping = false;
  resetGraph();
  runHud.className = '';
  runHud.textContent = run.lanes === 3 ? '3 SIMULATED PROBE LANES' : `${pre2023Groups[attackerId]} · 1 SIMULATED PROBE LANE`;
  showTime(0);

  let startedAt = null;
  let duration;
  let fromTime;
  function tick(now) {
    const phase = phases[phaseIndex];
    if (!phase) {
      finishRun();
      return;
    }
    if (startedAt === null) {
      startedAt = now;
      fromTime = modeledTime;
      duration = Math.max(showProbes(phase.events, run.lanes), 650);
    }
    const progress = Math.min(1, (now - startedAt) / duration);
    showTime(fromTime + (phase.time - fromTime) * progress);
    if (progress === 1) {
      renderPhase(phase, true);
      phaseIndex++;
      startedAt = null;
    }
    frame = requestAnimationFrame(tick);
  }
  frame = requestAnimationFrame(tick);
}

modeButtons.forEach(button => {
  button.addEventListener('click', () => {
    defense = button.dataset.mode;
    modeButtons.forEach(candidate => {
      const selected = candidate === button;
      candidate.classList.toggle('selected', selected);
      candidate.setAttribute('aria-pressed', String(selected));
    });
    playRun();
  });
});
mapProfile.addEventListener('change', playRun);
function applianceRoster(estate) {
  return estate.assets.filter(asset => asset.referenceCve).map(asset => asset.groupId).sort().join();
}

function drawReferenceCase() {
  if (!catalog) return null;
  if (!catalogDeck.length) catalogDeck = [...catalog.examples];
  const index = Math.floor(Math.random() * catalogDeck.length);
  const [example] = catalogDeck.splice(index, 1);
  return { example, context: catalog.infrastructure[example.context] };
}

function drawPre2023Group() {
  if (!pre2023Deck.length) pre2023Deck = Object.keys(pre2023Groups);
  const index = Math.floor(Math.random() * pre2023Deck.length);
  return pre2023Deck.splice(index, 1)[0];
}

function newInfra() {
  const previous = applianceRoster(estate);
  referenceCase = drawReferenceCase();
  pre2023Group = drawPre2023Group();
  do {
    estate = generateEstate({
      seedExercise: true,
      preferredIngress: referenceCase?.context.groups[0]
    });
  } while (applianceRoster(estate) === previous);
  catalogLabel.hidden = !referenceCase;
  if (referenceCase) {
    const { example, context } = referenceCase;
    catalogLabel.textContent = `${context.title} · Reference KEV Context (${example.id})`;
    catalogLabel.title = `${example.vendor} ${example.product}\n${context.defensiveFocus}\nATT&CK · ${example.techniques.join(', ')}`;
  }
  playRun();
}
document.getElementById('new-run-btn').addEventListener('click', newInfra);
document.getElementById('map-replay-btn').addEventListener('click', playRun);
document.getElementById('map-results-btn').addEventListener('click', finishRun);
window.addEventListener('resize', () => {
  resetGraph();
  phases.slice(0, phaseIndex).forEach(phase => renderPhase(phase));
});
async function startWire() {
  try {
    const response = await fetch('assets/wire-defense-catalog.json');
    if (!response.ok) throw new Error(`Catalog request returned ${response.status}`);
    catalog = await response.json();
  } catch {
    playRun();
    return;
  }
  newInfra();
}
startWire();
</script>
